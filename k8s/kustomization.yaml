apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: payment-service

resources:
  - namespace.yaml
  - migracao-job.yaml
  - deployment.yaml
  - service.yaml
  - scaledobject.yaml

images:
  - name: payment-service
    newTag: latest

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: payment-service-config
    envs:
      - payment-service.env

secretGenerator:
  - name: payment-service-credenciais
    literals:
      - PAYMENT_DB_USER=PAY
      - PAYMENT_DB_PASSWORD=pay_local
      - MONGODB_USERNAME=
      - MONGODB_PASSWORD=
