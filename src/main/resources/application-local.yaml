spring:
  datasource:
    hikari:
      pool-name: payment-pool
      maximum-pool-size: ${PAYMENT_DB_POOL_MAX:10}
      minimum-idle: ${PAYMENT_DB_POOL_MIN:2}
      connection-timeout: 3000
      validation-timeout: 2000
  jpa:
    hibernate:
      ddl-auto: validate
  data:
    mongodb:
      auto-index-creation: true
  threads:
    virtual:
      enabled: true

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    db:
      enabled: true
    redis:
      enabled: ${PAYMENT_REDIS_HEALTH_ENABLED:false}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
