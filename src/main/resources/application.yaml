spring:
  application:
    name: ${PAYMENT_APP_NAME:payment-service}
  profiles:
    default: ${PAYMENT_DEFAULT_PROFILE:local}
  datasource:
    url: ${PAYMENT_DB_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
    username: ${PAYMENT_DB_USER:PAY}
    password: ${PAYMENT_DB_PASSWORD:pay_local}
  flyway:
    enabled: false
  jpa:
    open-in-view: ${PAYMENT_JPA_OPEN_IN_VIEW:false}
    properties:
      hibernate:
        default_schema: ${PAYMENT_DB_SCHEMA:PAY}
        jdbc:
          time_zone: ${PAYMENT_JPA_TIME_ZONE:UTC}
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/payment}
      username: ${MONGODB_USERNAME:}
      password: ${MONGODB_PASSWORD:}
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

resilience:
  bulkheads:
    payment-provider:
      max-concurrent-calls: ${PAYMENT_BULKHEAD_PROVIDER_CALLS:16}
      max-wait: ${PAYMENT_BULKHEAD_PROVIDER_WAIT:50ms}
    invoice-authority:
      max-concurrent-calls: ${PAYMENT_BULKHEAD_INVOICE_CALLS:6}
      max-wait: ${PAYMENT_BULKHEAD_INVOICE_WAIT:0ms}
  circuit-breakers:
    charge-create:
      sliding-window: ${PAYMENT_CB_CHARGE_CREATE_WINDOW:COUNT_BASED}
      sliding-window-size: ${PAYMENT_CB_CHARGE_CREATE_WINDOW_SIZE:20}
      minimum-number-of-calls: ${PAYMENT_CB_CHARGE_CREATE_MIN_CALLS:10}
      failure-rate-threshold: ${PAYMENT_CB_CHARGE_CREATE_FAILURE_RATE:50}
      wait-in-open-state: ${PAYMENT_CB_CHARGE_CREATE_OPEN_WAIT:30s}
      slow-call-duration: ${PAYMENT_CB_CHARGE_CREATE_SLOW_CALL:15s}
      recorded-failures: ${PAYMENT_CB_CHARGE_CREATE_FAILURES:TOO_MANY_REQUESTS,SERVER_ERROR}
      record-connection-failures: ${PAYMENT_CB_CHARGE_CREATE_CONNECTION_FAILURES:true}
    charge-query:
      sliding-window: ${PAYMENT_CB_CHARGE_QUERY_WINDOW:TIME_BASED}
      sliding-window-size: ${PAYMENT_CB_CHARGE_QUERY_WINDOW_SIZE:60}
      minimum-number-of-calls: ${PAYMENT_CB_CHARGE_QUERY_MIN_CALLS:20}
      failure-rate-threshold: ${PAYMENT_CB_CHARGE_QUERY_FAILURE_RATE:60}
      wait-in-open-state: ${PAYMENT_CB_CHARGE_QUERY_OPEN_WAIT:15s}
      slow-call-duration: ${PAYMENT_CB_CHARGE_QUERY_SLOW_CALL:10s}
      recorded-failures: ${PAYMENT_CB_CHARGE_QUERY_FAILURES:TOO_MANY_REQUESTS,SERVER_ERROR}
      record-connection-failures: ${PAYMENT_CB_CHARGE_QUERY_CONNECTION_FAILURES:true}
    invoice-issue:
      sliding-window: ${PAYMENT_CB_INVOICE_ISSUE_WINDOW:COUNT_BASED}
      sliding-window-size: ${PAYMENT_CB_INVOICE_ISSUE_WINDOW_SIZE:10}
      minimum-number-of-calls: ${PAYMENT_CB_INVOICE_ISSUE_MIN_CALLS:5}
      failure-rate-threshold: ${PAYMENT_CB_INVOICE_ISSUE_FAILURE_RATE:50}
      wait-in-open-state: ${PAYMENT_CB_INVOICE_ISSUE_OPEN_WAIT:60s}
      slow-call-duration: ${PAYMENT_CB_INVOICE_ISSUE_SLOW_CALL:30s}
      recorded-failures: ${PAYMENT_CB_INVOICE_ISSUE_FAILURES:TOO_MANY_REQUESTS,SERVER_ERROR}
      record-connection-failures: ${PAYMENT_CB_INVOICE_ISSUE_CONNECTION_FAILURES:true}
  retries:
    charge-query:
      max-attempts: ${PAYMENT_RETRY_CHARGE_QUERY_ATTEMPTS:4}
      initial-backoff: ${PAYMENT_RETRY_CHARGE_QUERY_INITIAL:200ms}
      multiplier: ${PAYMENT_RETRY_CHARGE_QUERY_MULTIPLIER:2.0}
      max-backoff: ${PAYMENT_RETRY_CHARGE_QUERY_MAX:2s}
      jitter: ${PAYMENT_RETRY_CHARGE_QUERY_JITTER:0.3}
    charge-refund:
      max-attempts: ${PAYMENT_RETRY_CHARGE_REFUND_ATTEMPTS:3}
      initial-backoff: ${PAYMENT_RETRY_CHARGE_REFUND_INITIAL:500ms}
      multiplier: ${PAYMENT_RETRY_CHARGE_REFUND_MULTIPLIER:2.0}
      max-backoff: ${PAYMENT_RETRY_CHARGE_REFUND_MAX:4s}
      jitter: ${PAYMENT_RETRY_CHARGE_REFUND_JITTER:0.3}
    charge-cancel:
      max-attempts: ${PAYMENT_RETRY_CHARGE_CANCEL_ATTEMPTS:3}
      initial-backoff: ${PAYMENT_RETRY_CHARGE_CANCEL_INITIAL:500ms}
      multiplier: ${PAYMENT_RETRY_CHARGE_CANCEL_MULTIPLIER:2.0}
      max-backoff: ${PAYMENT_RETRY_CHARGE_CANCEL_MAX:4s}
      jitter: ${PAYMENT_RETRY_CHARGE_CANCEL_JITTER:0.3}
    invoice-query:
      max-attempts: ${PAYMENT_RETRY_INVOICE_QUERY_ATTEMPTS:5}
      initial-backoff: ${PAYMENT_RETRY_INVOICE_QUERY_INITIAL:1s}
      multiplier: ${PAYMENT_RETRY_INVOICE_QUERY_MULTIPLIER:2.0}
      max-backoff: ${PAYMENT_RETRY_INVOICE_QUERY_MAX:20s}
      jitter: ${PAYMENT_RETRY_INVOICE_QUERY_JITTER:0.5}

logging:
  level:
    com.clau.payment_service: ${PAYMENT_LOG_LEVEL:INFO}
