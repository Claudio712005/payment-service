spring:
  application:
    name: payment-service
  datasource:
    url: ${ST_PAY_DB_URL}
    username: ${ST_PAY_DB_USER}
    password: ${ST_PAY_DB_PASSWORD}
    hikari:
      pool-name: st-pay-pool
      maximum-pool-size: ${ST_PAY_DB_POOL_MAX:10}
      minimum-idle: ${ST_PAY_DB_POOL_MIN:2}
      connection-timeout: 3000
      validation-timeout: 2000
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: ${ST_PAY_DB_SCHEMA:PAY}
    default-schema: ${ST_PAY_DB_SCHEMA:PAY}
    create-schemas: false
    baseline-on-migrate: false
    validate-on-migrate: true
    out-of-order: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: ${ST_PAY_DB_SCHEMA:PAY}
        jdbc:
          time_zone: UTC
  data:
    mongodb:
      uri: ${MONGODB_URI}
      username: ${MONGODB_USERNAME}
      password: ${MONGODB_PASSWORD}
      auto-index-creation: true
  threads:
    virtual:
      enabled: true

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    db:
      enabled: true
  tracing:
    sampling:
      probability: ${ST_PAY_TRACE_SAMPLING:1.0}
  otlp:
    tracing:
      export:
        enabled: ${ST_PAY_OTLP_ENABLED:false}
    metrics:
      export:
        enabled: ${ST_PAY_OTLP_ENABLED:false}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  structured:
    format:
      console: ${ST_PAY_LOG_FORMAT:logstash}
  pattern:
    correlation: "[${spring.application.name:payment-service},%X{traceId:-},%X{spanId:-},%X{correlationId:-},%X{requestId:-}] "

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${ST_PAY_DB_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
    username: ${ST_PAY_DB_USER:PAY}
    password: ${ST_PAY_DB_PASSWORD:pay_local}
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/st_pay}
      username: ${MONGODB_USERNAME:}
      password: ${MONGODB_PASSWORD:}

logging:
  level:
    com.clau.payment_service: DEBUG
    org.flywaydb: INFO
