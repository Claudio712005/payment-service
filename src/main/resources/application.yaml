spring:
  application:
    name: payment-service
  profiles:
    default: local
  datasource:
    url: ${PAYMENT_DB_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
    username: ${PAYMENT_DB_USER:PAY}
    password: ${PAYMENT_DB_PASSWORD:pay_local}
  flyway:
    enabled: false
  jpa:
    open-in-view: false
    properties:
      hibernate:
        default_schema: ${PAYMENT_DB_SCHEMA:PAY}
        jdbc:
          time_zone: UTC
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/payment}
      username: ${MONGODB_USERNAME:}
      password: ${MONGODB_PASSWORD:}
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

resilience:
  bulkheads:
    payment-provider:
      max-concurrent-calls: ${PAYMENT_PROVIDER_BULKHEAD:16}
      max-wait: 50ms
    invoice-authority:
      max-concurrent-calls: ${INVOICE_AUTHORITY_BULKHEAD:6}
      max-wait: 0ms
  circuit-breakers:
    charge-create:
      sliding-window: COUNT_BASED
      sliding-window-size: 20
      minimum-number-of-calls: 10
      failure-rate-threshold: 50
      wait-in-open-state: 30s
      slow-call-duration: 15s
    charge-query:
      sliding-window: TIME_BASED
      sliding-window-size: 60
      minimum-number-of-calls: 20
      failure-rate-threshold: 60
      wait-in-open-state: 15s
    invoice-issue:
      sliding-window: COUNT_BASED
      sliding-window-size: 10
      minimum-number-of-calls: 5
      failure-rate-threshold: 50
      wait-in-open-state: 60s
      slow-call-duration: 30s
  retries:
    charge-query:
      max-attempts: 4
      initial-backoff: 200ms
      multiplier: 2.0
      max-backoff: 2s
      jitter: 0.3
    charge-refund:
      max-attempts: 3
      initial-backoff: 500ms
      multiplier: 2.0
      max-backoff: 4s
      jitter: 0.3
    charge-cancel:
      max-attempts: 3
      initial-backoff: 500ms
      multiplier: 2.0
      max-backoff: 4s
      jitter: 0.3
    invoice-query:
      max-attempts: 5
      initial-backoff: 1s
      multiplier: 2.0
      max-backoff: 20s
      jitter: 0.5

logging:
  level:
    com.clau.payment_service: ${PAYMENT_LOG_LEVEL:INFO}
