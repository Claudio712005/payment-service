spring:
  application:
    name: payment-service
  datasource:
    url: ${PAYMENT_DB_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
    username: ${PAYMENT_DB_USER:PAY}
    password: ${PAYMENT_DB_PASSWORD:pay_local}
    hikari:
      pool-name: payment-pool
      maximum-pool-size: ${PAYMENT_DB_POOL_MAX:10}
      minimum-idle: ${PAYMENT_DB_POOL_MIN:2}
      connection-timeout: 3000
      validation-timeout: 2000
  flyway:
    enabled: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: ${PAYMENT_DB_SCHEMA:PAY}
        jdbc:
          time_zone: UTC
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/payment}
      username: ${MONGODB_USERNAME:}
      password: ${MONGODB_PASSWORD:}
      auto-index-creation: true
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  threads:
    virtual:
      enabled: true

resilience:
  bulkheads:
    payment-provider:
      max-concurrent-calls: ${PAYMENT_PROVIDER_BULKHEAD:16}
      max-wait: 50ms
    invoice-authority:
      max-concurrent-calls: ${INVOICE_AUTHORITY_BULKHEAD:6}
      max-wait: 0ms
  circuit-breakers:
    charge-create:
      sliding-window: COUNT_BASED
      sliding-window-size: 20
      minimum-number-of-calls: 10
      failure-rate-threshold: 50
      wait-in-open-state: 30s
      slow-call-duration: 15s
    charge-query:
      sliding-window: TIME_BASED
      sliding-window-size: 60
      minimum-number-of-calls: 20
      failure-rate-threshold: 60
      wait-in-open-state: 15s
    invoice-issue:
      sliding-window: COUNT_BASED
      sliding-window-size: 10
      minimum-number-of-calls: 5
      failure-rate-threshold: 50
      wait-in-open-state: 60s
      slow-call-duration: 30s
  retries:
    charge-query:
      max-attempts: 4
      initial-backoff: 200ms
      multiplier: 2.0
      max-backoff: 2s
      jitter: 0.3
    charge-refund:
      max-attempts: 3
      initial-backoff: 500ms
      multiplier: 2.0
      max-backoff: 4s
      jitter: 0.3
    charge-cancel:
      max-attempts: 3
      initial-backoff: 500ms
      multiplier: 2.0
      max-backoff: 4s
      jitter: 0.3
    invoice-query:
      max-attempts: 5
      initial-backoff: 1s
      multiplier: 2.0
      max-backoff: 20s
      jitter: 0.5

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    db:
      enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.clau.payment_service: ${PAYMENT_LOG_LEVEL:INFO}

---
spring:
  config:
    activate:
      on-profile: migration
  main:
    web-application-type: none
    banner-mode: "off"
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: ${PAYMENT_DB_SCHEMA:PAY}
    default-schema: ${PAYMENT_DB_SCHEMA:PAY}
    create-schemas: false
    baseline-on-migrate: false
    validate-on-migrate: true
    clean-disabled: true
    out-of-order: false
    connect-retries: 20
    connect-retries-interval: 10
  datasource:
    hikari:
      pool-name: payment-migracao
      maximum-pool-size: 1
      minimum-idle: 0
      initialization-fail-timeout: -1
  jpa:
    hibernate:
      ddl-auto: none
  data:
    mongodb:
      auto-index-creation: false

management:
  endpoints:
    web:
      exposure:
        include: "health"

logging:
  level:
    org.flywaydb: INFO
    org.hibernate: WARN
