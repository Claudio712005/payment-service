spring:
  application:
    name: payment-service
  datasource:
    url: ${PAYMENT_DB_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
    username: ${PAYMENT_DB_USER:PAY}
    password: ${PAYMENT_DB_PASSWORD:pay_local}
    hikari:
      pool-name: payment-pool
      maximum-pool-size: ${PAYMENT_DB_POOL_MAX:10}
      minimum-idle: ${PAYMENT_DB_POOL_MIN:2}
      connection-timeout: 3000
      validation-timeout: 2000
  flyway:
    enabled: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: ${PAYMENT_DB_SCHEMA:PAY}
        jdbc:
          time_zone: UTC
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/payment}
      username: ${MONGODB_USERNAME:}
      password: ${MONGODB_PASSWORD:}
      auto-index-creation: true
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  threads:
    virtual:
      enabled: true

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    db:
      enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.clau.payment_service: ${PAYMENT_LOG_LEVEL:INFO}

---
spring:
  config:
    activate:
      on-profile: migration
  main:
    web-application-type: none
    banner-mode: "off"
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: ${PAYMENT_DB_SCHEMA:PAY}
    default-schema: ${PAYMENT_DB_SCHEMA:PAY}
    create-schemas: false
    baseline-on-migrate: false
    validate-on-migrate: true
    clean-disabled: true
    out-of-order: false
    connect-retries: 20
    connect-retries-interval: 10
  datasource:
    hikari:
      pool-name: payment-migracao
      maximum-pool-size: 1
      minimum-idle: 0
      initialization-fail-timeout: -1
  jpa:
    hibernate:
      ddl-auto: none
  data:
    mongodb:
      auto-index-creation: false

management:
  endpoints:
    web:
      exposure:
        include: "health"

logging:
  level:
    org.flywaydb: INFO
    org.hibernate: WARN
