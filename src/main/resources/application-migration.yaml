spring:
  main:
    web-application-type: none
    banner-mode: "off"
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: ${PAYMENT_DB_SCHEMA:PAY}
    default-schema: ${PAYMENT_DB_SCHEMA:PAY}
    create-schemas: false
    baseline-on-migrate: false
    validate-on-migrate: true
    clean-disabled: true
    out-of-order: false
    connect-retries: 20
    connect-retries-interval: 10
  datasource:
    hikari:
      pool-name: payment-migracao
      maximum-pool-size: 1
      minimum-idle: 0
      initialization-fail-timeout: -1
  jpa:
    hibernate:
      ddl-auto: none
  data:
    mongodb:
      auto-index-creation: false

logging:
  level:
    org.flywaydb: INFO
    org.hibernate: WARN
